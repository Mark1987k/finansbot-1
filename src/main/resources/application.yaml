spring:
  application:
    name: finansbot
  main:
    banner-mode: "off"
    web-application-type: none

server:
  port: 8080

# Playwright browser otomasyon ayarları
twitter:
  session-path: ${TWITTER_SESSION_PATH:auth.json}
  headless: ${TWITTER_HEADLESS:true}

# Scheduler configuration
app:
  scheduler:
    enabled: true
    cron: "0 0 * * * *"
