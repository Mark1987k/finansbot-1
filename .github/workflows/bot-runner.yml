name: Finans Bot - Continuous 6-Hour Run

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # Yedek tetikleyici
  workflow_dispatch:           # Manuel veya otomatik tetikleme için

permissions:
  actions: write
  contents: read

concurrency:
  group: finansbot-runner
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21 and Maven
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Install Playwright Browsers and Dependencies
      run: mvn compile exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

    - name: Restore Twitter Session
      run: echo "${{ secrets.TWITTER_SESSION_B64 }}" | base64 -d > auth.json

    - name: Run Spring Boot Application (5.5 Hours)
      run: |
        # Botu 5.5 saat (330 dk) çalıştır, süre bitince temizce sıradaki göreve devret
        timeout -k 15s 330m bash -c '
          while true; do
            echo "🚀 Bot başlatılıyor..."
            xvfb-run --auto-servernum mvn spring-boot:run
            echo "⚠️ Bot durdu! 5 saniye içinde yeniden başlatılıyor..."
            sleep 5
          done
        ' || true
        
        # Süreçleri temizle
        pkill -f spring-boot 2>/dev/null || true
        pkill -f Xvfb 2>/dev/null || true
      env:
        TWITTER_SESSION_PATH: auth.json
        TWITTER_HEADLESS: "false"

    - name: Auto-Trigger Next Run
      run: |
        echo "🔄 5.5 saatlik görev başarıyla bitti. Yeni görev anında başlatılıyor..."
        gh workflow run bot-runner.yml --ref main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
