name: Finans Bot - Continuous 6-Hour Run

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: finansbot-runner
  cancel-in-progress: true 

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21 and Maven
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Install Playwright Chromium
      run: mvn compile exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

    - name: Restore Twitter Session
      run: echo "${{ secrets.TWITTER_SESSION_B64 }}" | base64 -d > auth.json

    - name: Start Spring Boot Application
      run: xvfb-run --auto-servernum mvn spring-boot:run
      env:
        TWITTER_SESSION_PATH: auth.json
        TWITTER_HEADLESS: "false"
