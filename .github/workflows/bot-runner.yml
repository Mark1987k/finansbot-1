name: Finans Bot - Continuous 6-Hour Run

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # Yedek tetikleyici
  workflow_dispatch:           # Otomatik tetikleme için gerekli

# GitHub CLI'ın yeni görev tetikleyebilmesi için gerekli izin
permissions:
  actions: write
  contents: read

concurrency:
  group: finansbot-runner
  cancel-in-progress: false # Görevlerin çakışmasını ve birbirini öldürmesini engeller

jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350 # 6 saat (360 dk) dolmadan 350. dakikada güvenle yenisini başlatır
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21 and Maven
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Install Playwright Browsers and Dependencies
      run: mvn compile exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

    - name: Restore Twitter Session
      run: echo "${{ secrets.TWITTER_SESSION_B64 }}" | base64 -d > auth.json

    - name: Start Spring Boot Application with Auto-Restart Loop
      run: |
        # Bot beklenmedik şekilde çökerse hemen makine kapanmasın, tekrar başlatsın
        while true; do
          echo "🚀 Bot başlatılıyor..."
          xvfb-run --auto-servernum mvn spring-boot:run
          echo "⚠️ Bot beklenmedik şekilde durdu! 5 saniye içinde yeniden başlatılıyor..."
          sleep 5
        done
      env:
        TWITTER_SESSION_PATH: auth.json
        TWITTER_HEADLESS: "false"

    # GÖREV DURDUĞU VEYA SÜRE BİTTİĞİ AN YENİSİNİ TETİKLEYEN ADIM:
    - name: Auto-Trigger Next Run if Stopped
      if: always()
      run: |
        # Eğer en az 2 dakika çalıştıysa (derleme hatası değilse), yeni 6 saatlik görevi başlat
        if [ $SECONDS -gt 120 ]; then
          echo "🔄 Görev tamamlandı/durdu ($SECONDS sn çalıştı). Yeni 6 saatlik görev anında başlatılıyor..."
          gh workflow run bot-runner.yml
        else
          echo "⚠️ Görev çok kısa sürdü, hata döngüsüne girmemek için otomatik tetiklenmedi."
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
